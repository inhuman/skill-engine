# Словарь приложения: чем наполняют открытые слоты схемы.
#
# Ни одно значение отсюда движок не толкует — он передаёт их приложению как
# есть. Заводите свои.

# ── role ──────────────────────────────────────────────────────────────
# Имя профиля исполнения. За именем у приложения стоят бюджеты, таймауты,
# температура, усилие рассуждения.
roles:
  reader:       короткие чтения, маленький бюджет вызовов
  executor:     делает работу, право на запись
  investigator: длинные разбирательства, большой бюджет и wall-clock

# ── kind (скилла) ─────────────────────────────────────────────────────
# Род скилла — по нему приложение решает, как его подавать и исполнять.
skill_kinds:
  leaf:      делает работу сам
  composite: раскладывает задачу на другие скиллы

# ── kind (ассета) ─────────────────────────────────────────────────────
# Род нагрузки. Подсказывает, уместно ли содержимому попадать в контекст
# модели: код и конфигурацию отдают инструменту по ссылке, справочник и
# шаблон — подставляют в текст инструкции.
asset_kinds: [code, config, text, data]

# ── source и ref ──────────────────────────────────────────────────────
# Откуда берётся содержимое и как выглядит адрес. Разбирает резолвер
# приложения — формы ниже просто пример.
asset_sources:
  inline:    содержимое лежит в самом скилле (`content`)
  repo:      "ref: проект@ветка:путь/файл.py"
  storage:   "ref: путь/в/хранилище"
  service:   "ref: сервис:метод — аргументы в `args`"

# ── deliver ───────────────────────────────────────────────────────────
# Куда девать вывод инструмента, потребившего ассет.
deliver_routes:
  reply: вывод становится ответом хода
  file:  уходит пользователю файлом
  none:  доставки нет (то же, что не указывать)

# ── reasoning ─────────────────────────────────────────────────────────
# Шкала у каждого вендора своя; ниже — распространённая.
reasoning_levels: [low, medium, high]

# ── meta ──────────────────────────────────────────────────────────────
# Произвольные данные приложения. Движок сюда не смотрит.
meta_example:
  schedule:
    cron: "0 9 * * MON"
    timezone: Europe/Berlin
  owner: platform-team
  tags: [daily, report]
