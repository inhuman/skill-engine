# Weather through a browser: visit a page, take the number, answer.
#
# Shows: a `call` step without generation (the address is known, the model has
# nothing to do there) and the "decide" / "do" split — parsing the request runs
# WITHOUT tools, and the browser is handed only to the step that needs it.

skill_engine_version: "2.0.0"
skill_version: "1.0.0"
name: weather
description: Tell the weather in the named city.
role: reader
kind: leaf

servers: [browser]

workflow:
  tools: [browser]
  steps:
    - name: understand
      instruction: |
        Request: {{input}}

        city — the city as it is spelled in the weather site's URL
        (New York → new-york, Saint Petersburg → saint-petersburg).
      tools: []
      sampling:
        temperature: 0
      model: vllm/gemma-4-e4b       # a response_schema without a model choice = a silent hole
      response_schema:
        type: object
        properties:
          city: {type: string}
        required: [city]
      save_as: req

    - name: open_page
      call:
        tool: browser:navigate
        args:
          url: "https://example-weather.test/{{req.city}}"
      save_as: page

    - name: answer
      instruction: |
        The weather page for {{req.city}}:
        {{page}}

        Answer in one phrase: the temperature now and what the sky is doing.
        Take numbers only from the page; if you did not find them, say so.
      tools: []
