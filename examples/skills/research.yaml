# Answering a question from several sources at once.
#
# Shows `parallel` and the reason it is in the format: branches that did not run
# because of `when` land in `<collect>.skipped`. Without that the answering step
# cannot tell "the source had nothing" from "we never went to the source" — and
# will lie in good faith.

skill_engine_version: "2.0.0"
skill_version: "1.0.0"
name: research
description: Answer a question by gathering facts from several sources.
role: investigator
kind: leaf

servers: [docs, forum, web]

workflow:
  tools: [docs, forum, web]

  steps:
    - name: understand
      instruction: |
        The question: {{input}}

        topic — what is being asked about, in two or three words;
        need_web — true if the answer depends on recent events.
      tools: []
      model: vllm/gemma-4-e4b       # a response_schema without a model choice = a silent hole
      response_schema:
        type: object
        properties:
          topic: {type: string}
          need_web: {type: boolean}
        required: [topic, need_web]
      save_as: req

    - parallel:
        collect: sources
        on_error: continue
        branches:
          - - name: in_docs
              instruction: "Search the documentation for: {{req.topic}}. Return quotes."
              tools: [docs]
              max_calls: 3
              save_as: sources

          - - name: in_forum
              instruction: "Find discussions on the topic: {{req.topic}}. Return conclusions."
              tools: [forum]
              max_calls: 3
              save_as: sources

          - - name: in_web
              when: "req.need_web == true"
              instruction: "Look for recent material on the topic: {{req.topic}}."
              tools: [web]
              max_calls: 3
              save_as: sources

    - name: answer
      instruction: |
        The question: {{input}}
        What was gathered: {{sources}}
        These sources were not visited: {{sources.skipped}}

        Answer from what was gathered. Do NOT say a source from the "not
        visited" list had nothing — nobody looked there.
      tools: []
