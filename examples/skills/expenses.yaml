# An expense report: fetch, compute IN CODE, draw a chart, deliver as a file.
#
# Shows three things at once:
#   1. a CODE asset goes by reference ({from: asset:...}) — it does not pass
#      through the model's context, so the model does not rewrite it;
#   2. the data is passed by reference too — `{{rows.mem}}` is a working-memory
#      handle, not the text itself: a thousand-row fetch never enters the prompt;
#   3. `deliver` is declared on the asset — the route will not be forgotten on
#      the last step.

skill_engine_version: "2.0.0"
skill_version: "1.0.0"
name: expenses
description: Show the spending for a period as a chart by category.
role: executor
kind: leaf

servers: [ledger, sandbox]

workflow:
  tools: [ledger, sandbox]

  assets:
    chart:
      kind: code
      params: {lang: python}      # what is meaningful for code lives here, not at the asset's top level
      description: a bar chart of spending by category
      deliver: file
      content: |
        import json, sys, collections
        import matplotlib
        matplotlib.use("Agg")
        import matplotlib.pyplot as plt

        rows = json.load(sys.stdin)
        totals = collections.Counter()
        for r in rows:
            totals[r["category"]] += r["amount"]

        names = [n for n, _ in totals.most_common()]
        values = [totals[n] for n in names]
        plt.figure(figsize=(8, 4))
        plt.bar(names, values)
        plt.ylabel("amount")
        plt.tight_layout()
        plt.savefig("/tmp/expenses.png")
        print("/tmp/expenses.png")

  steps:
    - name: understand
      instruction: |
        Request: {{input}}

        period — the reporting period in words: "month", "quarter", "year".
      tools: []
      one_of: [month, quarter, year]
      save_as: period

    - name: fetch
      call:
        tool: list_transactions
        args:
          period: "{{period}}"
      on_server: ledger
      save_as: rows

    # The data goes into the script BY REFERENCE: the model neither sees nor
    # retells it.
    - name: draw
      call:
        tool: run
        args:
          code:
            from: "asset:chart"
          stdin:
            from: "{{rows.mem}}"
      on_server: sandbox
      save_as: picture

    - name: summary
      instruction: |
        The spending for the {{period}} has been gathered, the chart built and
        sent. Say in one phrase that it is done.
      tools: []
