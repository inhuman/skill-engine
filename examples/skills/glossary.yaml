# Translating a glossary: walk the list of terms and translate each one.
#
# Shows `for_each`: `in` takes a variable NAME, not a `{{...}}` template — the
# engine rejects that during validation. The iterations' results are merged into
# `collect`, and the answering step works with those.

skill_engine_version: "2.0.0"
skill_version: "1.0.0"
name: glossary
description: Translate a list of terms, keeping the variants established in the industry.
role: reader
kind: leaf

workflow:
  assets:
    known:
      kind: text
      description: settled translations that must not be changed
      content: |
        commit — commit (not "revision")
        merge request — merge request (not "pull request")
        rollback — rollback (not "reversal")
        latency — latency (not "lag")

  steps:
    - name: split
      instruction: |
        The list of terms: {{input}}
        Return the terms one per line, without numbering or explanations.
      tools: []
      save_as: terms

    - for_each:
        in: terms
        as: term
        collect: translated
        max_iterations: 50
        steps:
          - name: translate
            instruction: |
              Settled translations:
              {{asset:known}}

              Term: {{term}}

              Give the translation. If the term is in the list above, take it
              from there verbatim. One line, "term — translation", no
              explanations.
            tools: []
            save_as: translated

    - name: report
      instruction: |
        The translations: {{translated}}
        Collect them into a "term | translation" table. Add nothing.
      tools: []
