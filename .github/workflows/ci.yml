name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.5"
      - name: Vet
        run: go vet ./...
      # Also the guard on the library's central promise: imports_test.go fails
      # the moment production code gains a dependency, or a test gains one
      # outside the declared list.
      - name: Test
        run: go test ./... -count=1
      # Branches of a `parallel` step run in goroutines that share what the flow
      # was given. That sharing is deliberate — an asset three branches need is
      # fetched once — and it is exactly the kind of thing only the race
      # detector notices: a bug here is a wrong answer on a busy day, not a
      # crash on a quiet one.
      - name: Race
        run: go test ./... -count=1 -race
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.3.0 ./...

      # The example applications are SEPARATE modules — that is what keeps their
      # dependencies (eino, an SDK, whatever the next one uses) out of the
      # engine's go.mod, and it also means `go test ./...` above never sees
      # them. Without this step an example rots quietly, and an example that
      # does not build teaches the format wrong.
      - name: Examples
        run: |
          for mod in examples/*/go.mod; do
            dir=$(dirname "$mod")
            echo "── $dir"
            go vet -C "$dir" ./...
            go test -C "$dir" ./... -count=1
          done

      # The four architecture pictures are generated, and readme_test.go only
      # compares them WITH EACH OTHER — four files edited by hand in the same
      # wrong way would still agree. This is the other half: regenerate them and
      # fail if anything moved, which is what catches an SVG edited directly and
      # a generator whose output nobody re-ran.
      - name: Diagrams
        run: |
          python3 assets/architecture.py
          git diff --exit-code --stat assets/ \
            || { echo "::error::assets/ is out of date — run python3 assets/architecture.py and commit the result"; exit 1; }
