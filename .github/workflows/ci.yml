name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.5"
      - name: Vet
        run: go vet ./...
      # Also the guard on the library's central promise: imports_test.go fails
      # the moment production code gains a dependency, or a test gains one
      # outside the declared list.
      - name: Test
        run: go test ./... -count=1
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.3.0 ./...
