# Полная схема файла скилла
#
# Скилл — ЧИСТЫЙ YAML-файл `<name>.yaml`.
#   - валидация ЭТОЙ схемой в редакторе и в CI, до исполнения;
#   - автодополнение полей по схеме в IDE;
#
# Ход скилла описывается полем `workflow` — последовательностью шагов. Поле
# `playbook` (многострочный текст) — свободная инструкция исполнителю: подходит
# там, где шаги избыточны.
#
# $schema: JSON Schema draft 2020-12, записанная в YAML.

$schema: https://json-schema.org/draft/2020-12/schema
title: Skill
type: object
# Обязательны только те поля, без которых скилл не может быть выбран и
# исполнен. `trigger_examples`, `servers`, `role` в `skill_write` опциональны
# (проверено по коду), и схема, требующая их, отвергала бы пользовательские
# скиллы, созданные легально. Рекомендуемость выражается линтером (080), а не
# жёстким гейтом валидации.
required: [skill_engine_version, name, description]
additionalProperties: false

properties:

  # ─────────────────────────────────────────────────────────────────────
  # Версии: формата и самого скилла. Разные вещи, обе нужны.
  # ─────────────────────────────────────────────────────────────────────

  skill_engine_version:
    type: string
    pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
    examples: ["1.0.0"]
    description: |
      Версия ФОРМАТА, под которую написан скилл — фактически «какой
      минимум движка мне нужен». Движок читает поле и знает, как
      интерпретировать файл.

      Семантика частей:
        major — несовместимое изменение формата: скилл прошлого мажора без
                миграции не читается (сменилась семантика поля, исчезла
                конструкция);
        minor — добавлено необязательное поле. Скилл, который им пользуется,
                требует движок НЕ НИЖЕ этой минорной версии — в этом и польза
                минора: он выражает требуемый минимум, а не просто «что-то
                добавили»;
        patch — исправления движка, формат не изменился.

      Зачем. Пользовательские скиллы живут в `user_files` и НЕ обновляются с
      деплоем: сменив семантику поля, мы молча меняем поведение чужих скиллов,
      написанных под старые правила. Пример живого риска: `tools: []` сегодня
      значит «инструментов не выдавать», и это ЦЕНТРАЛЬНАЯ конструкция формата;
      если завтра пустой список начнёт значить «набор потока», старые скиллы
      получат доступ, который автор снимал намеренно, — и никто не заметит.

      Движок обязан уметь читать все выпущенные мажоры — или отказывать внятно
      («скилл требует 2.1.0, движок умеет 1.4.0»), а не молча исполнять по
      старым правилам.

      Отсутствует (legacy-скиллы) → читается как 1.0.0.

  skill_version:
    type: string
    pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
    examples: ["1.0.0", "2.3.1"]
    description: |
      Версия САМОГО скилла (semver). Двигается при каждой значимой
      правке, и по номеру видно, ЧТО за правка была:

        major — сменилась парадигма скилла, сломана обратная совместимость:
                скилл делает принципиально другое или иначе (что бы это ни
                значило в контексте конкретного скилла);
        minor — добавлены новые ходы/узлы, отрефакторены старые: состав шагов
                изменился;
        patch — мелкие правки, тюнинг промптов: состав шагов тот же.

      Различение НЕ косметическое — оно нужно при чтении замеров: перевод шага
      на `call:` (новый узел, minor) меняет ЦЕНУ хода, а правка формулировки
      (patch) — только точность ветвления. Без различения обе группы выглядят
      одинаково: «скилл поменялся».

      Зачем. Сегодня изменение скилла отслеживается ХЕШЕМ содержимого
      (`reconcile` сравнивает `hashContent`), а хеш не упорядочен: по нему
      нельзя сказать, чья версия свежее, нельзя откатиться осознанно и нельзя
      привязать замер к тому, что именно исполнялось.

      Скилл правится по нескольку раз в день, и после каждой правки снимается
      замер. Если в события пишется только ИМЯ скилла, через неделю уже не
      определить, какая версия дала какие числа: сравнение «было 10 вызовов,
      стало 3» без версии — сравнение неизвестно чего с неизвестно чем.

      Требования-спутники (в plan.md):
        - версия попадает в `agent_events` при матче и исполнении;
        - `reconcile` предпочитает БОЛЬШУЮ версию, а не «любое отличие хеша»;
        - A/B промптов (070) группирует замеры по версии;
        - сравнение — `github.com/Masterminds/semver/v3` (уже в vendor; читает
          «1.2.3» без префикса `v`, в отличие от `x/mod/semver`).

  # ─────────────────────────────────────────────────────────────────────
  # Идентификация и роутинг: когда этот скилл вообще выбирается
  # ─────────────────────────────────────────────────────────────────────

  name:
    type: string
    pattern: "^[a-z0-9][a-z0-9_-]{0,48}[a-z0-9]$|^[a-z0-9]$"
    maxLength: 50
    description: |
      Имя скилла = имя файла.

      Регулярка взята ИЗ КОДА (`skillfile.skillNameRE`), а не придумана: она
      допускает подчёркивание, и в проде есть живой пользовательский скилл
      `jira_get_project_key_and_name`. Схема строже кода отвергала бы правку
      скилла, созданного легально.

      Оно же — ключ включения программы в SKILL_PROGRAMS.

  description:
    type: string
    description: |
      Для ЧЕГО скилл. Идёт в эмбеддинг матчера (041) — от точности
      этого текста зависит, выберется ли скилл. Полезно писать и то, для чего
      скилл НЕ нужен ("НЕ для поиска по вики") — отрицания снимают путаницу
      между близкими скиллами.

  trigger_examples:
    type: array
    items: {type: string}
    description: |
      Живые формулировки, на которые скилл обязан сработать. Матчер
      считает близость к НИМ, а не только к description, поэтому примеры берут
      из прода (майнинг 070), а не выдумывают.

  servers:
    type: array
    items: {type: string}
    description: |
      MCP-серверы, доступные скиллу. Это ПОТОЛОК радиуса: `workflow.tools`
      и `tools` шага могут только сузить его.

  builtin_tools:
    type: array
    items: {type: string}
    description: |
      Встроенные инструменты, нужные ИСПОЛНИТЕЛЮ скилла: run_script,
      script_list, render_diagram и прочие тулы самого приложения (не MCP-серверов).

      Нужно потому, что воркеру достаётся только `memory` — остальные встроенные
      тулы есть у оркестратора. Плейбук, велящий воркеру звать `run_script` без
      этого объявления, промахивается в пустоту: eino отвечает «тул не
      существует», модель повторяет тот же вызов до упора бюджета. Линтер ловит
      расхождение правилом E5.

  role:
    enum: [reader, writer, executor, investigator, analyzer, self-checker]
    description: |
      Профиль исполнения: бюджеты вызовов, wall-clock, температура,
      reasoning effort. reader — короткие чтения; executor — делает работу;
      investigator — длинные разбирательства с большим бюджетом.

      Список сверен С КОДОМ (шесть значений, не три): `writer`, `analyzer` и
      `self-checker` существуют и используются. Схема, знающая меньше кода,
      отвергала бы работающие скиллы.

  kind:
    enum: [leaf, composite]
    default: leaf
    description: |
      composite — скилл, который сам раздаёт работу другим скиллам
      (bug-triage, find-info). leaf — обычный.

  temperature:
    type: number
    minimum: 0
    maximum: 1
    description: |
      Оверрайд температуры для всего скилла. Редкое поле (3 из 28).
      Диапазон [0,1] — как в коде (в схеме было [0,2], сверено при ревью).

      ВНИМАНИЕ: на пути ПРОГРАММЫ это поле не действует — модель шага строится
      с Temperature 0. Параметры генерации задаются ШАГУ (`sampling:`), потому
      что у шагов разная работа: классификатору нужен ноль, формулировке
      ответа — теплее.

  disabled:
    type: boolean
    default: false
    description: "Выключить скилл, не удаляя файл."

  # ─────────────────────────────────────────────────────────────────────
  # Программа: как скилл исполняется по шагам
  # ─────────────────────────────────────────────────────────────────────

  workflow:
    $ref: "#/$defs/Workflow"
    description: |
      Описание хода шагами. Задано → ход исполняется по ним; не задано →
      по свободной инструкции из `playbook`.

  playbook:
    type: string
    description: |
      Свободная инструкция исполнителю: что сделать и на что смотреть.
      Применяется, когда `workflow` не задан.

      Держать оба представления сразу не стоит: два действующих описания одного
      скилла расходятся, и какое из них исполняется становится вопросом
      конфигурации, а не текста.

  schedule:
    type: object
    additionalProperties: false
    required: [days, at]
    description: |
      [есть, 067] Расписание scheduled-скилла. Без этого поля
      `additionalProperties: false` отвергал бы все запланированные скиллы.
    properties:
      days: {type: string, description: "«mon-fri» | «daily»"}
      at: {type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"}
      tz: {type: string, description: "IANA-таймзона; пусто → Europe/Moscow"}


$defs:

  # ─────────────────────────────────────────────────────────────────────
  Fetch:
    type: object
    additionalProperties: false
    description: |
      Как тянуть внешний ассет. Сеть в горячем пути хода — риск
      реальный, но лечится он политикой, а не запретом: без свежести внешний
      ассет теряет смысл.

      Образцы в коде уже есть, изобретать нечего: `llm/embed.go` —
      экспоненциальный ретрай (3 попытки, 1/2/4 с), `llm/retry.go` —
      классификация transient (сеть, 429, 5xx и Bifrost-400 «шлюз не достучался»
      — повторяем; auth/bad request и мёртвый ctx — нет).
    properties:
      ttl:
        type: string
        default: "0s"
        description: |
          Сколько содержимое считается свежим. `0s` — тянуть каждый раз
          (умолчание: внешний ассет для того и внешний). `10m`, `1h`, `24h` —
          допустимый возраст кеша; разумно для кода из репы, где правки редки.
      timeout:
        type: string
        default: "5s"
        description: |
          Потолок на ОДНУ попытку. Жёсткий: ход не должен висеть на чужой
          недоступности.
      retries:
        type: integer
        default: 2
        minimum: 0
        maximum: 5
        description: |
          Сколько ПОВТОРОВ сверх первой попытки, с экспоненциальной паузой
          (1 с, 2 с, 4 с — как `llm/embed.go`). Повторяется только transient:
          повтор на 404 или 403 не изменит исход, а бюджет хода съест.
      on_unavailable:
        enum: [fail, stale, empty]
        default: fail
        description: |
          Что делать, когда достать не удалось после всех попыток:
            fail  — ассет недоступен, шаг получает отказ и решает по `on_error`;
            stale — отдать последнюю удачную копию, ЕСЛИ она есть (иначе fail);
            empty — отдать пустоту, шаг разбирается сам.

          `stale` — единственный режим, где ход продолжается на устаревших
          данных, поэтому деградация обязана быть ГРОМКОЙ: метрика и запись в
          `agent_events` со сроком давности копии. Молча подставленная вчерашняя
          вики-страница — худший из возможных исходов: ответ выглядит нормальным
          и не проверяется.

  # ─────────────────────────────────────────────────────────────────────
  Workflow:
    type: object
    required: [steps]
    additionalProperties: false
    properties:
      steps:
        type: array
        minItems: 1
        items: {$ref: "#/$defs/Step"}
        description: "Шаги, исполняемые по порядку."
      assets:
        type: object
        additionalProperties: {$ref: "#/$defs/Asset"}
        description: |
          Именованные полезные нагрузки, которые скилл передаёт инструменту
          ПО ССЫЛКЕ (`{"from": "<имя>"}`), не пропуская через контекст модели.

          Зачем вообще: gpt-oss не может точно воспроизвести многокилобайтный литерал
          через аргумент инструмента — он его РЕГЕНЕРИРУЕТ и портит (живой отказ 077:
          шесть SyntaxError подряд на скрипте рендера, потом захардкоженная сдача).
          Ассет решает это структурно: содержимое резолвится хост-сайд.

          В markdown-скиллах объявлялись в теле (```python asset=probe); в чистом
          YAML — отдельное поле, что заодно снимает разбор markdown-фенсов
          регулярками. Замер: 9 из 28 скиллов тащат Python в контексте модели.
      tools:
        type: array
        items: {type: string}
        description: |
          Радиус доступа потока. Умолчание — `servers` скилла.
          Задаётся, чтобы СУЗИТЬ: поток может оставить один сервер из двух,
          объявленных скиллом.
      vars:
        type: object
        additionalProperties: {type: string}
        description: "Начальные значения переменных."

  # ─────────────────────────────────────────────────────────────────────
  Step:
    type: object
    allOf:
      - $ref: "#/$defs/StepDependencies"
    description: |
      Шаг несёт РОВНО ОДНО действие: instruction | call | set |
      switch | if. Проверяется до исполнения.

      Переменные, доступные всегда:
        {{input}}   — сообщение пользователя
        {{history}} — предыдущие реплики разговора (2 обмена)
      Неизвестная переменная разворачивается в пустую строку, а не в текст
      маркера: доехавший до модели `{{foo}}` читается как часть инструкции.
    properties:
      name:
        type: string
        description: "Имя шага — для логов, событий и диагностики. Необязательное."

      # --- действие 1: работу делает модель --------------------------------
      instruction:
        type: string
        description: |
          Что сделать. Исполняется узким агентом (adk.ChatModelAgent)
          РОВНО с теми инструментами, что перечислены в `tools` шага.
      tools:
        type: array
        items: {type: string}
        description: |
          Инструменты ЭТОГО шага. Не задано → набор потока.
          ПУСТОЙ СПИСОК → инструментов не выдаётся вовсе, и это главная
          конструкция формата: запрет «в тот источник не ходи» становится
          невыполнимым вместо того, чтобы быть попрошенным.
          Расширить набор потока нельзя — только сузить.
      max_calls:
        type: integer
        minimum: 0
        description: |
          Потолок вызовов инструментов на шаге. Поле ШАГА, потому что в
          живых скиллах лимиты разные: поиск по коду — одна попытка, обход
          дерева — до восьми.

          0 — НЕ «без ограничения»: подставляется потолок исполнителя (у нашего
          8 генераций). Безлимитного шага в формате нет намеренно.
      one_of:
        type: array
        items: {type: string}
        description: |
          Допустимые значения результата. Шаг-классификатор существует
          ради ветвления, а switch сравнивает ТОЧНО.
          Реализуется двумя слоями (FR-006):
            1) грамматика декодирования (enum), где модель шага её держит —
               значение вне списка НЕВОЗМОЖНО;
            2) нормализация кодом — фолбэк; берёт последнее вхождение и
               ЛОМАЕТСЯ на «это точно t1, а не foreign» (даст foreign).
          См. FR-007: через harmony-плагин грамматика молча не доезжает.
      model:
        type: string
        description: |
          Модель шага. Два мотива: классификатору не нужна большая
          модель (цена) и только на не-harmony модели работает грамматика.
      response_schema:
        type: object
        description: |
          Схема структурного ответа шага. Результат кладётся в переменную
          объектом, поля доступны как `{{var.field}}` — ОДИН уровень вложенности.

          Зачем: `01-k8s-logs` извлекает кластер, namespace и под ОДНИМ шагом
          вместо трёх, то есть −2 генерации на ход в скилле, где их всего 3–4.

          Осмысленна только там, где работает грамматика декодирования: на
          harmony-пути схема выбрасывается МОЛЧА, и «структурный ответ»
          выродится в «модель обычно отвечает JSON» — необнаруживаемую дыру.
          Поэтому `model:` ОБЯЗАТЕЛЕН рядом (`dependentRequired` ниже): шаги
          идут на модели субагента (gpt-oss через harmony), где схема не
          применяется, и умолчание молча ломало бы разбор.

      sampling:
        $ref: "#/$defs/Sampling"

      # --- действие 2: работу делает код -----------------------------------
      call:
        $ref: "#/$defs/Call"

      # --- действие 3: вычисление ------------------------------------------
      set:
        $ref: "#/$defs/Set"

      # --- действие 4-5: ветвление ------------------------------------------
      switch:
        $ref: "#/$defs/Switch"
      if:
        $ref: "#/$defs/If"

      # --- действие 6: выход из скилла ---------------------------------------
      exit:
        $ref: "#/$defs/Exit"

      # --- действие 7: передать работу другому скиллу -------------------------
      delegate:
        $ref: "#/$defs/Delegate"

      # --- действие 8: повторить шаги по коллекции ----------------------------
      for_each:
        $ref: "#/$defs/ForEach"

      # --- действие 9: несколько веток одновременно --------------------------
      parallel:
        $ref: "#/$defs/Parallel"

      # --- общее -------------------------------------------------------------
      on_server:
        type: string
        description: |
          На КАКОМ сервере исполняется шаг. Поддерживает `{{var}}` —
          имя вычисляется на исполнении.

          Для `call:` — адресат вызова; для `instruction:` — чьи инструменты
          выдаются шагу.

          Зачем: 14 из 28 скиллов несут ВАРИАНТЫ одного сервера
          (gitlab-dev/prod, пять k8s-кластеров, prometheus dev/prod). Без выбора
          на исполнении каждый требует `switch` из 2–5 почти одинаковых веток.
          Сильнее подстановки в `call.tool`, потому что сужает радиус и у
          шага-МОДЕЛИ: сегодня `k8s-pods` отдаёт ей инструменты всех пяти
          кластеров сразу.

          Права не ослабевают: `allowServer` проверяет ПОДСТАВЛЕННОЕ имя, и оно
          обязано входить в набор потока.

      when:
        type: string
        description: |
          Условие применимости шага (тот же синтаксис, что у `if.cond`).
          Ложно → шаг пропускается, поток идёт дальше.

          Зачем отдельно от `if:`: выразимо и через ветвление, но `when:`
          читается как СВОЙСТВО шага, а не как разветвление потока, и не
          растит вложенность там, где ветки нет — есть только «делать или нет».

          Живой класс: задача подходит скиллу частично. `when:` делает пропуск
          ВИДИМЫМ в событиях — иначе ход «иногда даёт нужный ответ, иногда
          нет», и причина не видна.
      save_as:
        type: string
        description: "Переменная для результата. Пусто — результат не сохраняется."
      on_error:
        enum: [abort, continue, skip]
        default: abort
        description: |
          Реакция на отказ шага.
            abort    — прекратить поток (умолчание);
            continue — записать отказ в переменную и идти дальше;
            skip     — пропустить остаток ТЕКУЩЕЙ ветки.
          Отказ по правам помечается DENIED:, прочий сбой — ERROR:; политика
          их различает, ветвление `is empty` — нет.

  # ─────────────────────────────────────────────────────────────────────
  # Связки, проверяемые схемой (ошибка видна в редакторе, а не в проде).
  # StepDependencies применяется к Step через allOf ниже.
  StepDependencies:
    dependentRequired:
      # Грамматика декодирования не доезжает на harmony-пути МОЛЧА, а шаги идут
      # на модели субагента (gpt-oss). Схема без выбора модели = тихая дыра.
      response_schema: [model]

  # ─────────────────────────────────────────────────────────────────────
  Call:
    type: object
    required: [tool]
    additionalProperties: false
    description: |
      Вызов инструмента БЕЗ участия модели. Ни инструкции, ни выбора,
      ни пересказа — результат попадает в переменную дословно.

      Здесь основной выигрыш формата: шаг-модель стоит ДВЕ генерации (решить
      позвать + пересказать), и обе лишние, когда аргументы известны заранее.
      Замер: 6 → 3 генерации на ход.

      Права НЕ обходятся: вызов идёт через ту же цепочку BeforeCall, что и
      вызов от модели (policy/RBAC, pattern-детектор, session-бюджет, события,
      OTel), и не может назвать сервер вне набора потока.
    properties:
      tool:
        type: string
        pattern: "^[^:]+(:.+)?$"
        description: "Инструмент в форме «сервер:инструмент»."
      args:
        type: object
        description: |
          Аргументы. {{var}} подставляется в СТРОКОВЫЕ значения, включая
          вложенные; числа, флаги и форма объекта остаются как записаны.
      save_as: {type: string}
      on_error:
        enum: [abort, continue, skip]

  # ─────────────────────────────────────────────────────────────────────
  Sampling:
    type: object
    additionalProperties: false
    description: |
      Параметры генерации ЭТОГО шага.

      Единица настройки — шаг, а не скилл, по той же причине, по которой шагу
      принадлежат `tools` и `max_calls`: у шагов разная работа. Классификатору
      нужна нулевая температура и жёсткое сэмплирование — он выбирает из двух
      значений; финальной формулировке ответа — потеплее, иначе текст выходит
      деревянным. Один параметр на весь скилл обслуживает оба плохо.

      Заданное здесь перекрывает умолчания движка; незаданное берётся из
      профиля модели. Набор сверен с `llm.ChatModelOpts` и `llm.SamplingOpts` —
      это ровно то, что доезжает до инференса, без выдуманных ручек.
    properties:
      temperature:
        type: number
        minimum: 0
        maximum: 2
        description: |
          0 — детерминированно (классификаторы, извлечение полей, вызовы по
          шаблону); выше — свободнее (формулировка ответа человеку).
      top_p:
        type: number
        minimum: 0
        maximum: 1
        description: "Nucleus sampling. 0 → параметр не передаётся."
      top_k:
        type: integer
        minimum: 0
        description: "Отсечка по числу кандидатов. 0 → не передаётся."
      min_p:
        type: number
        minimum: 0
        maximum: 1
        description: "Порог вероятности кандидата. 0 → не передаётся."
      max_tokens:
        type: integer
        minimum: 1
        description: |
          Потолок выходных токенов ЭТОГО шага; не задан — действует глобальный
          MaxOutputTokens. Нужен там, где шаг по природе краток, а сорвавшаяся
          генерация дорога: 31.07 два куска ревью выдали 32768 и 22482 токена
          вместо обычных ~2300 и один сломал собственный структурный ответ.
          Поднять выше окна модели нельзя — кламп идёт после переопределения.
      repetition_penalty:
        type: number
        minimum: 0
        description: |
          Штраф за повтор. Полезен шагам, склонным зацикливаться на длинных
          перечислениях.
      reasoning:
        enum: [low, medium, high]
        description: |
          Глубина рассуждения (у моделей, которые её поддерживают). Замерено на
          проекте: `high` на роли investigator съедал 83% времени субагентов —
          поэтому уровень задаётся ШАГУ, которому он нужен, а не всему скиллу.

  # ─────────────────────────────────────────────────────────────────────
  Delegate:
    type: object
    required: [skill, task]
    additionalProperties: false
    description: |
      Передать работу другому скиллу. Это то, чем сегодня заняты
      composite-скиллы (`kind: composite`): `bug-triage` зовёт `jira-ticket`,
      `find-info` — `wiki-find` и `kg-search`, оба через `spawn_agent(skill=…)`.

      Без этого действия composite-скилл, получивший `workflow`, исполнился бы
      как обычный поток и ПОТЕРЯЛ бы спавн-инструменты целиком — то есть
      перестал бы делать своё дело.

      Радиус делегата — радиус ВЫЗВАННОГО скилла, а не вызывающего: скилл
      объявляет свои серверы сам, и делегирование не расширяет доступ
      вызывающего (тот же принцип, что у `spawn_agent` сегодня).
    properties:
      skill:
        type: string
        description: "Имя скилла, которому передаётся работа."
      task:
        type: string
        description: "Задача словами; поддерживает {{var}}."
      save_as: {type: string}
      on_error:
        enum: [abort, continue, skip]

  # ─────────────────────────────────────────────────────────────────────
  ForEach:
    type: object
    required: [in, as, steps]
    additionalProperties: false
    description: |
      Повторить шаги для каждого элемента коллекции.

      Живые случаи, которые без этого не выражаются:
      `release-find-commits` («для КАЖДОГО из 5 сервисов найди репозиторий и
      коммит»), `check-release` («по каждому сервису релиза из versions.yaml»),
      `parse-wiki-release` («по каждому сервису из всех таблиц»). Длина списка
      заранее неизвестна — развернуть в фиксированные шаги нельзя.

      Отложить `for_each` было ошибкой обобщения: вывод «ни разу не
      понадобился» снят с ТРЁХ скиллов и распространён на 28.
    properties:
      in:
        type: string
        description: |
          Переменная с коллекцией. Массив (например, из `response_schema`)
          итерируется поэлементно; строка — по непустым строкам. Второе
          покрывает наблюдаемый случай «список сервисов, добытый инструментом».
      as:
        type: string
        description: "Имя переменной элемента внутри тела цикла."
      steps:
        type: array
        minItems: 1
        items: {$ref: "#/$defs/Step"}
      collect:
        type: string
        description: |
          Переменная, куда собираются результаты итераций (строки, разделённые
          переносом). Не задана — результаты остаются только внутри итерации.
      max_iterations:
        type: integer
        minimum: 1
        maximum: 50
        default: 10
        description: |
          Потолок итераций. ОБЯЗАТЕЛЕН по смыслу, даже когда не задан явно:
          цикл по коллекции неизвестной длины — прямой путь к runaway, а
          сессионный бюджет остановит его уже после того, как сожжёт ход.
          Список длиннее потолка обрабатывается частично, и это ГОВОРИТСЯ в
          результате, а не проглатывается.
      on_error:
        enum: [abort, continue, skip]
        default: abort
        description: |
          Что делать, когда итерация отказала. `continue` — пометить и
          идти дальше: один элемент из пяти не нашёлся — не повод терять
          остальные четыре.

  # ─────────────────────────────────────────────────────────────────────
  Parallel:
    type: object
    required: [branches]
    additionalProperties: false
    description: |
      Несколько независимых веток одновременно. Сегодня это
      `spawn_agents_parallel(mode="all", tasks=[…])` в `find-info` и
      `bug-triage`: параллельный сбор улик из разных источников.

      Ветки НЕ ВИДЯТ переменных друг друга — только те, что были до развилки.
      Иначе результат зависел бы от порядка завершения, а он недетерминирован;
      формат существует ради обратного.
    properties:
      branches:
        type: array
        minItems: 2
        items:
          type: array
          items: {$ref: "#/$defs/Step"}
      collect:
        type: string
        description: "Переменная, куда сводятся результаты веток по порядку объявления."
      on_error:
        enum: [abort, continue, skip]
        description: |
          Поведение при отказе ОДНОЙ ветки. `continue` — самое частое: собрать
          то, что получилось, и сказать, чего не хватает.

  # ─────────────────────────────────────────────────────────────────────
  Exit:
    type: object
    additionalProperties: false
    description: |
      Прекратить программу и вернуть ход на ОБЫЧНЫЙ путь приложения: скилл
      подошёл ошибочно, и продолжать по его шагам значит выдать неверный
      ответ уверенно.

      Решение — не отдельный механизм, а ТИП ШАГА: у классификатора в начале
      программы уже есть ветка «не мой случай», ей достаточно `exit:`. Выход
      решается шагом детерминированно, а не моделью по ходу работы.

      Приложение узнаёт о выходе событием — промахи маршрутизации остаются
      размеченными.
    properties:
      reason:
        type: string
        description: "Почему вышли — в событие и в лог. Читают при разборе промахов роутинга."

  # ─────────────────────────────────────────────────────────────────────
  Set:
    type: object
    required: [var, value]
    additionalProperties: false
    description: |
      Присваивание без обращения к модели. Так выражают правила,
      которые иначе применяла бы модель:
      «t1_vpc_vip → docs/resources/vpc_vip.md».
    properties:
      var: {type: string}
      value:
        type: string
        description: "Поддерживает {{var}}."

  # ─────────────────────────────────────────────────────────────────────
  Switch:
    type: object
    required: [var, cases]
    additionalProperties: false
    description: "Ветвление по значению переменной."
    properties:
      var: {type: string}
      cases:
        type: object
        additionalProperties:
          type: array
          items: {$ref: "#/$defs/Step"}
      default:
        type: array
        items: {$ref: "#/$defs/Step"}

  # ─────────────────────────────────────────────────────────────────────
  If:
    type: object
    required: [cond, then]
    additionalProperties: false
    description: "Ветвление по условию."
    properties:
      cond:
        type: string
        description: |
          Формы условия:
            var == значение
            var != значение
            var is empty        — пусто ИЛИ помеченный отказ (ERROR:/DENIED:)
            var is not empty
          `is empty` существует потому, что ветвлению «не нашли — ищем иначе»
          пустота и отказ означают одно, хотя политике — разное.
      then:
        type: array
        items: {$ref: "#/$defs/Step"}
      else:
        type: array
        items: {$ref: "#/$defs/Step"}

  # ─────────────────────────────────────────────────────────────────────
  Asset:
    type: object
    additionalProperties: false
    description: |
      Именованная нагрузка, передаваемая инструменту по ссылке.

      Описывается ДВУМЯ НЕЗАВИСИМЫМИ осями — их намеренно не сводят в один
      enum, иначе получится комбинаторика (code_inline, code_repo, config_url…):

        kind   — ЧТО это: code | text | config | data
        source — ОТКУДА берётся: inline | repo | user_file | url

      Любая пара осмысленна: конфиг бывает и inline, и из репы; код бывает и
      тут же в скилле, и подтянутым. Разделение осей — это же и ответ на вопрос
      «а если завтра появится новый источник»: добавляется значение одной оси,
      а не N новых типов.

      ДВА СПОСОБА ИСПОЛЬЗОВАНИЯ, и `kind` подсказывает уместный:

        {from: "asset:имя"}   в аргументе шага `call:` — содержимое
                              резолвится ХОСТ-САЙД и через модель НЕ проходит.
                              Так используют `code` и `config`: модель их не
                              переписывает, потому что вообще не видит.

        {{asset:имя}}         в тексте `instruction:` — содержимое
                              ПОДСТАВЛЯЕТСЯ в промпт. Так используют `text` и
                              `data`: справочник соответствий или шаблон
                              отчёта бесполезны, если модель их не читает.

      То есть `kind` — не украшение: он отвечает на вопрос «этой нагрузке место
      в контексте модели или мимо него». Ошибка в выборе видна сразу — код в
      контексте начнёт «регенерироваться» (077), а справочник по ссылке не
      повлияет ни на что.

      Абстракция уже заложена в коде: `asset.Source` (internal/asset/asset.go)
      с комментарием «SkillBody is the first source (077); user_files / repo@ref
      plug in here later without touching the core wiring». Схема достраивает
      задуманное, а не изобретает.
    properties:

      kind:
        enum: [code, text, config, data]
        default: text
        description: |
          ЧТО это по существу — влияет на валидацию и на то, что с ним можно
          делать:
            code   — исполняемый код (нужен `lang`; линтер может проверить
                     синтаксис до исполнения);
            text   — промпт-фрагмент, шаблон письма, инструкция для другого
                     агента;
            config — структурированные настройки (можно валидировать схемой,
                     см. `validate_with`);
            data   — справочник, фикстура, таблица соответствий; на неё
                     смотрят как на данные, не разбирая.

      source:
        enum: [inline, repo, user_file, mcp, url]
        default: inline
        description: |
          ОТКУДА берётся содержимое:
            inline    — прямо здесь, в поле `content`;
            repo      — из GitLab-репозитория (`ref` = «проект@ветка:путь»).
                        Механизм существует: библиотека скриптов синкает
                        репозиторий в кеш и работает без передеплоя;
            user_file — из `user_files` автора скилла (`ref` = путь);
            mcp       — результат MCP-вызова (`ref` = «сервер:инструмент»,
                        аргументы в `args`). ЭТО путь для внешних данных:
                        вики-страница, список из внешней системы;
            url       — [НЕ РЕАЛИЗОВАН] прямой HTTP. Нарушает Принцип II
                        конституции (интеграции с внешними системами — только
                        через MCP-мультиплексор): скилл, тянущий страницу по
                        HTTP из движка, и есть та «отдельная SDK-ветка», против
                        которой принцип написан. Оставлен в enum как явно
                        отвергнутый, чтобы не переоткрывать вопрос.

          Внешний ассет тянется В ХОДЕ, а не из периодического кеша: смысл
          внешнего источника — СВЕЖЕСТЬ. Вики-страница правится, список сервисов
          меняется, справочник дополняется; отдать вчерашнюю копию значит
          отменить причину, по которой ассет сделали внешним.

          Исключение — статика по природе: код скрипта в репе меняется редко, и
          для него разумен `fetch.ttl` побольше. Политика задаётся на ассете
          (см. `fetch`), а не навязывается источником.

      content:
        type: string
        description: "Содержимое. Обязательно при `source: inline`, иначе не указывается."

      ref:
        type: string
        description: |
          Адрес содержимого для внешних источников. Обязателен при
          `source: repo | user_file | url`.
          Формы:
            repo      `проект@ветка:путь/файл.py`
            user_file `путь/в/user_files`
            mcp       `сервер:инструмент` (аргументы — в `args`)

      args:
        type: object
        description: |
          Аргументы MCP-вызова для `source: mcp`. Поддерживают `{{var}}`
          в строковых значениях — как в шаге `call:`.

      lang:
        type: string
        description: |
          Язык для `kind: code` — python | sql | bash | … Даёт линтеру (080)
          повод проверить синтаксис ДО того, как скилл исполнится в проде.

      deliver:
        enum: [reply, file, none]
        default: none
        description: |
          Хост-сайд маршрут ВЫВОДА инструмента, потребившего ассет:
            reply — вывод становится финальным ответом хода;
            file  — доставляется пользователю файлом;
            none  — возвращается в переменную шага.

          Существует потому, что модель забывает прикрепить хрупкий аргумент
          `_deliver` (живой отказ 077: рендер отработал и PASSED, модель не
          указала `_deliver`, гейт убил ход за шаг до финиша). Автор скилла
          объявляет маршрут, мост фиксирует его детерминированно.

      fetch:
        $ref: "#/$defs/Fetch"
        description: |
          Политика получения для внешних источников (`repo | user_file | url`).
          Для `inline` не применяется.

      validate_with:
        type: string
        description: |
          Для `kind: config` — имя схемы, которой валидировать
          содержимое до исполнения. Нужно ли, или достаточно того, что
          инструмент сам отвергнет плохой конфиг? Отличие в моменте: линтер
          скажет автору сразу, инструмент — в проде у пользователя.

      description:
        type: string
        description: |
          Для чего этот ассет — читает ЧЕЛОВЕК, правящий скилл. Особенно нужно
          внешним ассетам: `content` не виден в файле, и без описания непонятно,
          что именно приедет по ссылке.

    allOf:
      # inline обязан нести содержимое, внешний — адрес. Проверяется схемой, а
      # не движком: ошибку такого рода надо видеть в редакторе, а не в проде.
      - if:
          properties: {source: {const: inline}}
        then:
          required: [content]
      - if:
          properties: {source: {enum: [repo, user_file, url]}}
        then:
          required: [ref]
      - if:
          properties: {kind: {const: code}}
        then:
          required: [lang]
